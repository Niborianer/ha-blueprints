blueprint:
  name: Linked Entities by Label Groups (unlimited groups)
  description: >
    Sync entities only within their label-group. Create as many labels (=groups) as you want
    and assign entities to them. One automation can handle all groups.
  domain: automation
  input:
    delay_milliseconds:
      name: Delay (ms)
      default: 150
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: ms
          mode: box

    exclude_entities:
      name: Exclude entities (optional)
      default: []
      selector:
        entity:
          multiple: true

    group_labels:
      name: Groups (labels)
      description: Select the labels that represent your sync-groups (e.g. sync_wohnzimmer, sync_flur).
      selector:
        label:
          multiple: true

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: state_changed

variables:
  delay_ms: !input delay_milliseconds
  excluded: !input exclude_entities
  group_labels: !input group_labels

condition:
  - condition: template
    value_template: >-
      {% set e = trigger.event.data.entity_id %}
      {% set ns = trigger.event.data.new_state %}
      {% set os = trigger.event.data.old_state %}
      {% if e is none or ns is none or os is none %}
        false
      {% elif ns.context.id == this.context.id %}
        false
      {% elif e in excluded %}
        false
      {% else %}
        {# entity must have at least one of the selected group labels #}
        {% set ent_labels = labels(e) %}
        {{ (ent_labels | select('in', group_labels) | list | length) > 0 }}
      {% endif %}

action:
  - variables:
      entity_id: "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state }}"
      old_state: "{{ trigger.event.data.old_state }}"
      domain: "{{ entity_id.split('.')[0] }}"

      ent_labels: "{{ labels(entity_id) }}"
      # Take the first matching label as the "group" for this trigger
      group_label: >-
        {{ (ent_labels | select('in', group_labels) | list | first) }}

      group_entities: >-
        {{ (label_entities(group_label) | reject('in', excluded) | list) }}

      others: "{{ group_entities | reject('eq', entity_id) | list }}"
      other_lights: "{{ others | select('match', '^light\\.') | list }}"
      other_fans: "{{ others | select('match', '^fan\\.') | list }}"

  - choose:
      # ON/OFF sync (any domain)
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.state != new_state.state and new_state.state in ['on','off'] and (others | length > 0) }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ new_state.state == 'on' }}"
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ others }}"
              - conditions:
                  - condition: template
                    value_template: "{{ new_state.state == 'off' }}"
                sequence:
                  - service: homeassistant.turn_off
                    target:
                      entity_id: "{{ others }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Brightness sync (lights only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'light'
                 and (old_state.attributes.brightness != new_state.attributes.brightness)
                 and (new_state.attributes.brightness is defined)
                 and (other_lights | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ other_lights }}"
              brightness: "{{ new_state.attributes.brightness }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Color temp sync (lights only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'light'
                 and (old_state.attributes.color_temp != new_state.attributes.color_temp)
                 and (new_state.attributes.color_temp is defined)
                 and (other_lights | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ other_lights }}"
              color_temp: "{{ new_state.attributes.color_temp }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Fan percentage sync (fans only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'fan'
                 and (old_state.attributes.percentage != new_state.attributes.percentage)
                 and (new_state.attributes.percentage is defined)
                 and (other_fans | length > 0) }}
        sequence:
          - service: fan.set_percentage
            data:
              entity_id: "{{ other_fans }}"
              percentage: "{{ new_state.attributes.percentage }}"
          - delay:
              milliseconds: "{{ delay_ms }}"
