blueprint:
  name: Sync Linked Entities (Multi-Groups)
  description: >
    Sync entities within multiple independent groups in ONE automation.
    If any entity in a group changes (on/off/brightness/color_temp/percentage),
    only the other entities of that SAME group are updated.
  domain: automation

  input:
    delay_milliseconds:
      name: Delay (ms)
      description: Delay after syncing (throttle).
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: ms
          mode: box

    group1_entities:
      name: Group 1
      selector:
        entity:
          multiple: true
      default: []

    group2_entities:
      name: Group 2
      selector:
        entity:
          multiple: true
      default: []

    group3_entities:
      name: Group 3
      selector:
        entity:
          multiple: true
      default: []

    group4_entities:
      name: Group 4
      selector:
        entity:
          multiple: true
      default: []

    group5_entities:
      name: Group 5
      selector:
        entity:
          multiple: true
      default: []

    group6_entities:
      name: Group 6
      selector:
        entity:
          multiple: true
      default: []

mode: queued
max: 50
max_exceeded: silent

variables:
  delay_ms: !input delay_milliseconds
  g1: !input group1_entities
  g2: !input group2_entities
  g3: !input group3_entities
  g4: !input group4_entities
  g5: !input group5_entities
  g6: !input group6_entities

trigger:
  - platform: event
    event_type: state_changed

condition:
  - condition: template
    value_template: >-
      {% set e = trigger.event.data.entity_id %}
      {% set ns = trigger.event.data.new_state %}
      {% set os = trigger.event.data.old_state %}
      {% if e is none or ns is none or os is none %}
        false
      {% elif ns.context.id == this.context.id %}
        false
      {% else %}
        {{ e in (g1 + g2 + g3 + g4 + g5 + g6) }}
      {% endif %}

action:
  - variables:
      entity_id: "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state }}"
      old_state: "{{ trigger.event.data.old_state }}"

      # !!! KRITISCH: linked_entities muss eine echte LISTE sein (nicht Text).
      # Wir nutzen namespace, damit am Ende wirklich ein Python-List-Objekt entsteht.
      linked_entities: >-
        {% set e = trigger.event.data.entity_id %}
        {% set ns = namespace(lst=[]) %}
        {% if e in g1 %}
          {% set ns.lst = g1 %}
        {% elif e in g2 %}
          {% set ns.lst = g2 %}
        {% elif e in g3 %}
          {% set ns.lst = g3 %}
        {% elif e in g4 %}
          {% set ns.lst = g4 %}
        {% elif e in g5 %}
          {% set ns.lst = g5 %}
        {% elif e in g6 %}
          {% set ns.lst = g6 %}
        {% endif %}
        {{ ns.lst }}

      others: "{{ linked_entities | reject('eq', entity_id) | list }}"

  - choose:
      # ON
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.state != new_state.state
                 and new_state.state == 'on'
                 and (others | length > 0) }}
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: "{{ others }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # OFF
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.state != new_state.state
                 and new_state.state == 'off'
                 and (others | length > 0) }}
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ others }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # FAN percentage
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.attributes.percentage != new_state.attributes.percentage
                 and (new_state.attributes.percentage is defined)
                 and (others | length > 0) }}
        sequence:
          - service: fan.set_percentage
            data:
              entity_id: "{{ others }}"
              percentage: "{{ new_state.attributes.percentage }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Light brightness
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.attributes.brightness != new_state.attributes.brightness
                 and (new_state.attributes.brightness is defined)
                 and (others | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ others }}"
              brightness: "{{ new_state.attributes.brightness }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Light color_temp
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.attributes.color_temp != new_state.attributes.color_temp
                 and (new_state.attributes.color_temp is defined)
                 and (others | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ others }}"
              color_temp: "{{ new_state.attributes.color_temp }}"
          - delay:
              milliseconds: "{{ delay_ms }}"
