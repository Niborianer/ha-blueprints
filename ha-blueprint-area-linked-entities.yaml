blueprint:
  name: Linked Entities by Groups (unlimited groups, no labels)
  description: >
    Select multiple Home Assistant group helpers. Each group can contain unlimited entities.
    If any entity in a group changes, only that group is synchronized.
  domain: automation
  input:
    delay_milliseconds:
      name: Delay (ms)
      description: How long to delay changes to linked entities.
      default: 200
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: ms
          mode: box

    exclude_entities:
      name: Exclude entities (optional)
      description: Entities that should never be synced even if they are in a selected group.
      default: []
      selector:
        entity:
          multiple: true

    sync_groups:
      name: Groups
      description: Select the group helpers that represent your sync-groups.
      selector:
        entity:
          multiple: true
          filter:
            domain: group

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: state_changed

variables:
  delay_ms: !input delay_milliseconds
  excluded: !input exclude_entities
  groups: !input sync_groups

  # Flatten all members of all selected groups
  all_members: >-
    {% set ns = namespace(e=[]) %}
    {% for g in groups %}
      {% set ns.e = ns.e + (expand(g) | map(attribute='entity_id') | list) %}
    {% endfor %}
    {{ ns.e | reject('in', excluded) | unique | list }}

condition:
  - condition: template
    value_template: >-
      {% set e = trigger.event.data.entity_id %}
      {% set ns = trigger.event.data.new_state %}
      {% set os = trigger.event.data.old_state %}
      {% if e is none or ns is none or os is none %}
        false
      {% elif ns.context.id == this.context.id %}
        false
      {% elif e in excluded %}
        false
      {% else %}
        {{ e in all_members }}
      {% endif %}

action:
  - variables:
      entity_id: "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state }}"
      old_state: "{{ trigger.event.data.old_state }}"
      domain: "{{ entity_id.split('.')[0] }}"

      # Find the first group that contains the triggering entity
      trigger_group: >-
        {% set found = namespace(g='') %}
        {% for g in groups %}
          {% set members = expand(g) | map(attribute='entity_id') | list %}
          {% if entity_id in members %}
            {% set found.g = g %}
            {% break %}
          {% endif %}
        {% endfor %}
        {{ found.g }}

      group_entities: >-
        {% if trigger_group %}
          {{ expand(trigger_group) | map(attribute='entity_id') | reject('in', excluded) | list }}
        {% else %}
          []
        {% endif %}

      others: "{{ group_entities | reject('eq', entity_id) | list }}"
      other_lights: "{{ others | select('match', '^light\\.') | list }}"
      other_fans: "{{ others | select('match', '^fan\\.') | list }}"

  - choose:
      # ON/OFF sync (any entity types)
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.state != new_state.state and new_state.state in ['on','off'] and (others | length > 0) }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ new_state.state == 'on' }}"
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ others }}"
              - conditions:
                  - condition: template
                    value_template: "{{ new_state.state == 'off' }}"
                sequence:
                  - service: homeassistant.turn_off
                    target:
                      entity_id: "{{ others }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Brightness sync (lights only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'light'
                 and (old_state.attributes.brightness != new_state.attributes.brightness)
                 and (new_state.attributes.brightness is defined)
                 and (other_lights | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ other_lights }}"
              brightness: "{{ new_state.attributes.brightness }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Color temp sync (lights only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'light'
                 and (old_state.attributes.color_temp != new_state.attributes.color_temp)
                 and (new_state.attributes.color_temp is defined)
                 and (other_lights | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ other_lights }}"
              color_temp: "{{ new_state.attributes.color_temp }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # Fan percentage sync (fans only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'fan'
                 and (old_state.attributes.percentage != new_state.attributes.percentage)
                 and (new_state.attributes.percentage is defined)
                 and (other_fans | length > 0) }}
        sequence:
          - service: fan.set_percentage
            data:
              entity_id: "{{ other_fans }}"
              percentage: "{{ new_state.attributes.percentage }}"
          - delay:
              milliseconds: "{{ delay_ms }}"
