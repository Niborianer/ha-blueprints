blueprint:
  name: Multi Linked Entity Groups (one automation, multiple rooms)
  description: >
    Link multiple independent groups of entities in ONE automation.
    If any entity in a group changes, only that group is synced.
    Supports ON/OFF for any domain, brightness/color_temp for lights, percentage for fans.
  domain: automation
  input:
    delay_milliseconds:
      name: Delay (ms)
      description: Small throttle to reduce ping-pong.
      default: 150
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: ms
          mode: box

    exclude_entities:
      name: Exclude entities (optional)
      description: Entities that should never be synced even if selected in a group.
      default: []
      selector:
        entity:
          multiple: true

    group1_entities:
      name: Group 1 (e.g. Wohnzimmer)
      selector:
        entity:
          multiple: true
      default: []

    group2_entities:
      name: Group 2 (e.g. Flur)
      selector:
        entity:
          multiple: true
      default: []

    group3_entities:
      name: Group 3 (e.g. Schlafzimmer)
      selector:
        entity:
          multiple: true
      default: []

    group4_entities:
      name: Group 4 (optional)
      selector:
        entity:
          multiple: true
      default: []

    group5_entities:
      name: Group 5 (optional)
      selector:
        entity:
          multiple: true
      default: []

    group6_entities:
      name: Group 6 (optional)
      selector:
        entity:
          multiple: true
      default: []

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: state_changed

variables:
  delay_ms: !input delay_milliseconds
  excluded: !input exclude_entities

  g1: !input group1_entities
  g2: !input group2_entities
  g3: !input group3_entities
  g4: !input group4_entities
  g5: !input group5_entities
  g6: !input group6_entities

  # All entities that are part of any configured group (minus excluded)
  all_entities: >-
    {% set all = (g1 + g2 + g3 + g4 + g5 + g6) | unique | list %}
    {{ all | reject('in', excluded) | list }}

condition:
  - condition: template
    value_template: >-
      {% set e = trigger.event.data.entity_id %}
      {% set ns = trigger.event.data.new_state %}
      {% set os = trigger.event.data.old_state %}
      {% if e is none or ns is none or os is none %}
        false
      {% elif ns.context.id == this.context.id %}
        false
      {% else %}
        {{ e in all_entities }}
      {% endif %}

action:
  - variables:
      entity_id: "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state }}"
      old_state: "{{ trigger.event.data.old_state }}"
      domain: "{{ entity_id.split('.')[0] }}"

      # Determine which group this entity belongs to (first match wins)
      group_entities: >-
        {% set groups = [g1, g2, g3, g4, g5, g6] %}
        {% for grp in groups %}
          {% if entity_id in grp %}
            {{ (grp | reject('in', excluded) | list) }}
            {% break %}
          {% endif %}
        {% endfor %}

      others: "{{ group_entities | reject('eq', entity_id) | list }}"
      other_lights: "{{ others | select('match', '^light\\.') | list }}"
      other_fans: "{{ others | select('match', '^fan\\.') | list }}"

  - choose:
      # --- ON/OFF sync for anything in the group
      - conditions:
          - condition: template
            value_template: >-
              {{ old_state.state != new_state.state and new_state.state in ['on','off'] and (others | length > 0) }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ new_state.state == 'on' }}"
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ others }}"
              - conditions:
                  - condition: template
                    value_template: "{{ new_state.state == 'off' }}"
                sequence:
                  - service: homeassistant.turn_off
                    target:
                      entity_id: "{{ others }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # --- Brightness sync (lights only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'light'
                 and (old_state.attributes.brightness != new_state.attributes.brightness)
                 and (new_state.attributes.brightness is defined)
                 and (other_lights | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ other_lights }}"
              brightness: "{{ new_state.attributes.brightness }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # --- Color temperature sync (lights only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'light'
                 and (old_state.attributes.color_temp != new_state.attributes.color_temp)
                 and (new_state.attributes.color_temp is defined)
                 and (other_lights | length > 0) }}
        sequence:
          - service: light.turn_on
            data:
              entity_id: "{{ other_lights }}"
              color_temp: "{{ new_state.attributes.color_temp }}"
          - delay:
              milliseconds: "{{ delay_ms }}"

      # --- Fan percentage sync (fans only)
      - conditions:
          - condition: template
            value_template: >-
              {{ domain == 'fan'
                 and (old_state.attributes.percentage != new_state.attributes.percentage)
                 and (new_state.attributes.percentage is defined)
                 and (other_fans | length > 0) }}
        sequence:
          - service: fan.set_percentage
            data:
              entity_id: "{{ other_fans }}"
              percentage: "{{ new_state.attributes.percentage }}"
          - delay:
              milliseconds: "{{ delay_ms }}"
